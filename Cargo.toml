[package]
name = "oxbucket"
version = "0.1.0"
edition = "2021"

# Tests spawn `target/debug/s3rs` (or $S3RS_BIN), so the binary keeps the
# historical name even though the crate is now called oxbucket.
[[bin]]
name = "s3rs"
path = "src/main.rs"

[dependencies]
axum = "=0.8.8"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
md-5 = "0.10"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "test-util"] }
# Integration tests drive the server over raw HTTP. TLS is off: everything
# in the suites talks plain http://127.0.0.1.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
